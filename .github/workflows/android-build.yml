name: Android checks and optional APK build

on:
  push:
    branches: [main]
    paths:
      - "mojing/android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mojing/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mojing/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process --max-workers=2

      - name: Build debug APK
        if: github.event_name == 'workflow_dispatch'
        run: ./gradlew assembleDebug --no-daemon '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process --max-workers=2

      - name: Build optimized CI test APK
        if: github.event_name == 'workflow_dispatch'
        run: |
          free -h
          ./gradlew assembleRelease --no-daemon '-Dorg.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process --max-workers=1

      - name: Upload debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && hashFiles('mojing/android/app/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mojing-debug
          path: mojing/android/app/build/outputs/apk/debug/*.apk
          retention-days: 1

      - name: Upload optimized CI test APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mojing-ci-test-not-for-upgrade
          path: mojing/android/app/build/outputs/apk/release/*.apk
          retention-days: 1
