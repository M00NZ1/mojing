name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "mojing/android/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "mojing/android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mojing/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build optimized CI test APK
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleRelease --no-daemon '-Dorg.gradle.jvmargs=-Xmx6144m -Dfile.encoding=UTF-8' --max-workers=2

      - name: Upload debug APK
        if: ${{ !cancelled() && hashFiles('mojing/android/app/build/outputs/apk/debug/*.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mojing-debug
          path: mojing/android/app/build/outputs/apk/debug/*.apk

      - name: Upload optimized CI test APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mojing-ci-test-not-for-upgrade
          path: mojing/android/app/build/outputs/apk/release/*.apk
